# Shazamer as a Docker Swarm service (replaces the blue-green standalone).
# Deploy:  set -a; . .env; set +a; docker stack deploy -c docker-stack.yml shazamer
#
# Routed by Traefik via deploy.labels (swarm provider on the `traefik`
# overlay). Host comes from $SHAZAMER_HOST (kept out of the repo, set in
# the gitignored .env). `docker stack deploy` ignores env_file/mem_limit/
# container_name, so SENTRY_DSN is interpolated and the limit is in
# deploy.resources.
services:
  app:
    image: shazamer_app:latest
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHON_ENV=Production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SHAZAM_CONCURRENCY=${SHAZAM_CONCURRENCY:-8}
      - KEEP_AUDIO_DAYS=${KEEP_AUDIO_DAYS:-14}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://shazamer.pierregallet.com}
      - SLSKD_URL=${SLSKD_URL:-}
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
    volumes:
      - type: bind
        source: /home/sharon/shazamer/data
        target: /app/data
      - type: bind
        source: /home/sharon/shazamer/media
        target: /app/media
      - type: bind
        source: /home/sharon/shazamer/uploads
        target: /app/uploads
      - type: bind
        source: /home/sharon/shazamer/tmp
        target: /app/tmp
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.shazamer.rule=Host(`${SHAZAMER_HOST:-shazamer.pierregallet.com}`)"
        - "traefik.http.routers.shazamer.entrypoints=web"
        - "traefik.http.services.shazamer.loadbalancer.server.port=8000"
      resources:
        limits:
          # Was 6G to survive the one-shot STFT of a whole set. The pipeline
          # streams now — feature extraction was measured at 24 MB, flat with
          # duration — so this was cut to 1G. That proved too tight: the
          # measurement covered decoding only, and probe extraction was
          # spawning one ffmpeg per probe with no bound, which scales with set
          # length. A long set opened hundreds at once and the container was
          # OOM-killed.
          #
          # Extraction is bounded now, so the ceiling is roughly the Python
          # process plus `concurrency` ffmpeg processes — a few hundred MB.
          # 2G is deliberate headroom over that estimate rather than a measured
          # peak; the estimate has been wrong once already.
          memory: 2G
          # Eight parallel probes plus BPM/key detection actually use CPU now.
          cpus: "3.0"
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  traefik:
    external: true
