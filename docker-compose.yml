version: "3.8"

# Base compose for local development only
# Production runs as a Swarm service (docker-stack.yml), routed by the
# Traefik edge in the genius infra repo via its deploy.labels.

services:
  shazamer:
    build: .
    container_name: shazamer_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./tmp:/app/tmp
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
