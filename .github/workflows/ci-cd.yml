name: "CI/CD Pipeline"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-cd-${{ github.ref }}
  # Economy: cancel a superseded run only on protected-branch pushes (rapid
  # commits → only the latest tests+deploys). NEVER cancel a PR run, so
  # feature-branch tests always complete and verify mergeability. A
  # release-please release commit never cancels the in-flight real run.
  cancel-in-progress: >-
    ${{ github.event_name != 'pull_request'
        && !contains(github.event.head_commit.message, '): release ')
        && !contains(github.event.head_commit.message, 'release-please--branches--') }}

jobs:
  tests:
    name: "\U0001F9EA Tests"
    runs-on: ubuntu-latest
    # Safety net: a hung test fails in 15 min instead of running to the 6h
    # job default (a missing-mock test once burned 6h × many runs of credit).
    timeout-minutes: 45
    if: >-
      (github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main')
      && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio pytest-cov anyio httpx

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Typecheck and build here rather than discovering a TypeScript
      # regression during the production image build.
      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run tests
        run: uv run pytest -x -q -m "not integration" --ignore=tests/test_integration.py

  release-please:
    name: "\U0001F4E6 Release Please"
    needs: [tests]
    runs-on: ubuntu-latest
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'chore(main): release')

    steps:
      - uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python
          token: ${{ secrets.GHP_TOKEN }}
          target-branch: main

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create release archive
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
          mkdir -p "shazamer-${VERSION}"
          cp -r src web/src web/package.json web/index.html web/vite.config.ts \
                web/tsconfig.json requirements.txt README.md LICENSE Makefile \
                Dockerfile "shazamer-${VERSION}/"
          tar -czf "shazamer-${VERSION}.tar.gz" "shazamer-${VERSION}"
          zip -r "shazamer-${VERSION}.zip" "shazamer-${VERSION}"

      - name: Upload Release Artifacts
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
          gh release upload ${{ steps.release.outputs.tag_name }} \
            "shazamer-${VERSION}.tar.gz" \
            "shazamer-${VERSION}.zip"

  auto-merge:
    name: "\U0001F500 Auto Merge Release"
    needs: [tests, release-please]
    runs-on: ubuntu-latest
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'

    concurrency:
      group: auto-merge-release-please
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Find and merge release-please PR
        env:
          GH_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: |
          sleep 10
          PR_NUMBER=$(gh pr list --head "release-please--branches--main" --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "Found release-please PR #$PR_NUMBER"
            gh pr merge "$PR_NUMBER" --squash
            echo "Successfully merged release-please PR #$PR_NUMBER"
          else
            echo "No open release-please PR found, skipping"
          fi

  deploy:
    name: "\U0001F680 Deploy"
    needs: [tests, auto-merge]
    runs-on: ubuntu-latest
    if: >-
      !failure() && !cancelled()
      && github.event_name != 'pull_request'
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
    timeout-minutes: 45

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-action

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          HOST=$(echo "$SSH_HOST" | cut -d':' -f1)
          PORT=$(echo "$SSH_HOST" | grep -o ':[0-9]*' | cut -d':' -f2 || echo "22")
          ssh-keyscan -H -p $PORT $HOST >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Soulseek. Optional — absent secrets write empty values, which is
          # exactly how the feature stays switched off.
          SLSKD_URL: ${{ secrets.SLSKD_URL }}
          SLSKD_API_KEY: ${{ secrets.SLSKD_API_KEY }}
          SLSKD_SLSK_USERNAME: ${{ secrets.SLSKD_SLSK_USERNAME }}
          SLSKD_SLSK_PASSWORD: ${{ secrets.SLSKD_SLSK_PASSWORD }}
        run: |
          HOST=$(echo $SSH_HOST | cut -d':' -f1)
          PORT=$(echo $SSH_HOST | grep -o ':[0-9]*' | cut -d':' -f2 || echo "22")

          # 1. Update code
          ssh -p $PORT $SSH_USER@$HOST "
            set -e
            cd $DEPLOY_PATH
            git fetch origin
            git reset --hard origin/main
          "

          # 2. Merge the runtime env rather than replacing it.
          #
          # This used to `cat >` two lines over the whole file, which meant any
          # variable set on the server by hand — Soulseek credentials, an API
          # key — was silently wiped by the next deploy. Anything CI does not
          # manage is now left alone, so the server .env is a place secrets can
          # actually live.
          # Only non-empty secrets are written, so an unset one leaves whatever
          # is already on the server rather than blanking it.
          {
            printf 'PYTHON_ENV=Production\n'
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            [ -n "$SLSKD_URL" ] && printf 'SLSKD_URL=%s\n' "$SLSKD_URL"
            [ -n "$SLSKD_API_KEY" ] && printf 'SLSKD_API_KEY=%s\n' "$SLSKD_API_KEY"
            [ -n "$SLSKD_SLSK_USERNAME" ] && printf 'SLSKD_SLSK_USERNAME=%s\n' "$SLSKD_SLSK_USERNAME"
            [ -n "$SLSKD_SLSK_PASSWORD" ] && printf 'SLSKD_SLSK_PASSWORD=%s\n' "$SLSKD_SLSK_PASSWORD"
            true
          } \
            | ssh -p $PORT $SSH_USER@$HOST "
              set -e
              cd $DEPLOY_PATH
              touch .env && chmod 600 .env
              MANAGED=\$(cat)
              # Keys CI owns are rewritten; every other line survives.
              OWNED=\$(printf '%s\n' \"\$MANAGED\" | cut -d= -f1 | paste -sd'|' -)
              KEPT=\$(grep -vE \"^(\$OWNED)=\" .env 2>/dev/null || true)
              printf '%s\n' \"\$MANAGED\" > .env.new
              [ -n \"\$KEPT\" ] && printf '%s\n' \"\$KEPT\" >> .env.new
              mv .env.new .env && chmod 600 .env
              echo \"env: \$(grep -c '=' .env) variable(s)\"
            "

          # 3. Run blue-green deployment
          ssh -p $PORT $SSH_USER@$HOST "
            set -e
            cd $DEPLOY_PATH
            bash scripts/deploy.sh
          "

      - name: Post-deploy verification
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          HOST=$(echo $SSH_HOST | cut -d':' -f1)
          PORT=$(echo $SSH_HOST | grep -o ':[0-9]*' | cut -d':' -f2 || echo "22")

          # The service runs under Swarm now, not blue-green: there is no
          # .deploy-env and no fixed container name, so resolve the running
          # task and exec into that.
          echo "Waiting for the new task to report healthy..."
          ssh -p $PORT $SSH_USER@$HOST "
            set -e
            for attempt in \$(seq 1 30); do
              # Replica count first: a healthy container is not enough if the
              # service is running fewer than it should. A clean exit once left
              # it at 0/1 with nothing serving, and a check that only looked for
              # a healthy container would have called that a success.
              REPLICAS=\$(docker service ls --filter name=shazamer_app --format '{{.Replicas}}')
              RUNNING=\${REPLICAS%%/*}
              WANTED=\${REPLICAS##*/}
              # The worker runs the same image and does the actual work. A
              # deploy that leaves it down, or on old code, is not a success —
              # one did exactly that, and the fix written to unstick an
              # analysis never reached the process running it.
              WORKER=\$(docker service ls --filter name=shazamer_worker --format '{{.Replicas}}')
              W_RUNNING=\${WORKER%%/*}
              W_WANTED=\${WORKER##*/}
              CONTAINER=\$(docker ps --filter 'name=shazamer_app' --filter 'health=healthy' -q | head -1)
              if [ -n \"\$CONTAINER\" ] && [ \"\$RUNNING\" = \"\$WANTED\" ] && [ \"\$W_RUNNING\" = \"\$W_WANTED\" ]; then
                echo \"Healthy container: \$CONTAINER\"
                docker exec \$CONTAINER python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()\"
                exit 0
              fi
              sleep 10
            done
            echo \"No healthy task after 5 minutes (app: \$REPLICAS worker: \$WORKER).\"
            docker service ps shazamer_app --no-trunc | head -20
            CONTAINER=\$(docker ps --filter 'name=shazamer_app' -q | head -1)
            [ -n \"\$CONTAINER\" ] && docker logs \$CONTAINER --tail 50
            exit 1
          "

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment to shazamer.pierregallet.com completed successfully!"
          else
            echo "Deployment failed! Check the logs for more information."
          fi
