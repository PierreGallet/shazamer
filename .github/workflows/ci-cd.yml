name: "CI/CD Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    # BROUILLONS IGNORES, et la mise en « prête » DECLENCHE.
    #
    # Une PR en brouillon relançait tout le pipeline à chaque commit. C'est
    # precisement la periode ou l'on pousse le plus souvent et ou le verdict
    # importe le moins : le travail n'est pas fini, on ne va pas fusionner.
    #
    # `types` doit etre declare EN ENTIER des qu'on le declare : les trois
    # valeurs par defaut (`opened`, `synchronize`, `reopened`) disparaissent
    # sinon, et la PR ne testerait plus rien du tout a l'ouverture. On y ajoute
    # `ready_for_review`, l'evenement emis quand on sort du brouillon — sans lui,
    # passer une PR en prête ne declencherait aucune execution, puisque ce n'est
    # ni un commit ni une reouverture.
    #
    # Le saut se fait par une condition de JOB (`draft == false`) et non par un
    # filtre d'evenement, parce que GitHub n'en propose pas pour l'etat brouillon.
    # Aucun contexte de statut n'est requis sur ces depots — verifie le 30/09 —
    # donc un job saute ne bloque aucune fusion.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-cd-${{ github.ref }}
  # Les executions de PR superseded sont ANNULEES, comme celles de master.
  #
  # Elles ne l'etaient pas : « ne jamais annuler une PR, pour que les tests de
  # branche aillent toujours au bout ». L'intention est bonne, le cout ne l'est
  # pas — trois poussees d'affilee sur une branche faisaient trois pipelines
  # complets, alors qu'on ne fusionne que le DERNIER commit. C'est donc lui seul
  # qui doit rendre un verdict, et il verifie exactement l'etat qui sera fusionne.
  # Meme raisonnement que noctambule, qui l'appliquait deja.
  #
  # Le commit de release reste epargne : il ne doit jamais tuer l'execution reelle
  # en vol, qui ne serait remplacee par rien.
  cancel-in-progress: >-
    ${{ !contains(github.event.head_commit.message, '): release ')
        && !contains(github.event.head_commit.message, 'release-please--branches--') }}

jobs:
  tests:
    name: "\U0001F9EA Tests"
    runs-on: ubuntu-latest
    # Safety net: a hung test fails in 15 min instead of running to the 6h
    # job default (a missing-mock test once burned 6h × many runs of credit).
    timeout-minutes: 45
    # `!draft` : rien sur une PR en brouillon — voir la note sur `types` en
    # tete de fichier.
    # LES TESTS NE TOURNENT QUE SUR UNE PR.
    #
    # Ils tournaient aussi a la fusion et rejouaient donc ce que la PR venait de
    # valider. Mesure du 01/10 sur triton : 14 minutes facturees pour la PR dont
    # 12 pour les tests, puis la fusion les a rejoues — ~28 minutes pour un
    # changement.
    #
    # La contrepartie est assumee : la branche par defaut n'est plus testee telle
    # qu'elle sera fusionnee. Elle se couvre en exigeant « branche a jour avec la
    # base » avant fusion, auquel cas l'execution de la PR teste EXACTEMENT
    # l'etat fusionne.
    if: >-
      ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main') && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release')))
      && github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      # ── La branche est-elle a jour avec la base ? ──────────────────────
      #
      # Ce controle remplace le reglage GitHub « Require branches to be up to
      # date before merging », INDISPONIBLE sur un plan free pour un depot prive
      # (« Upgrade to GitHub Pro or make this repository public »). Verifie le
      # 01/10 : l'API de protection de branche repond 403.
      #
      # Il compte parce que les tests ne tournent plus a la fusion. Si cette
      # branche est en retard sur la base, l'execution valide un etat qui n'est
      # PAS celui qui sera fusionne : deux PR sans conflit textuel mais
      # incompatibles passeraient toutes les deux au vert et casseraient la prod
      # une fois reunies.
      #
      # `merge-base --is-ancestor base HEAD` repond exactement a la question : la
      # base est-elle un ancetre de ma tete ? Si oui, ma branche contient tout ce
      # que la base contient, et la tester revient a tester l'etat fusionne.
      #
      # Place en PREMIER et sans `continue-on-error` : inutile de payer une suite
      # complete pour apprendre ensuite qu'il faut rebaser et tout rejouer.
      - name: "La branche est-elle a jour avec ${{ github.base_ref }} ?"
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          # `--depth=1` ne suffit pas pour `merge-base` : il faut l'historique
          # commun. On approfondit jusqu'a le trouver, par paliers, plutot que de
          # cloner tout le depot d'entree de jeu.
          for p in 50 200 1000; do
            git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null 2>&1 && break
            git fetch --deepen=$p origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            git fetch --deepen=$p origin HEAD >/dev/null 2>&1 || true
          done
          if git merge-base --is-ancestor "origin/${{ github.base_ref }}" HEAD; then
            echo "OK  la branche contient toute la base, l'execution teste l'etat fusionne"
          else
            n=$(git rev-list --count "HEAD..origin/${{ github.base_ref }}" 2>/dev/null || echo "?")
            echo "::error title=Branche en retard::Cette branche est en retard de $n commit(s) sur ${{ github.base_ref }}. Les tests ne tournent plus a la fusion, donc ce verdict ne vaudrait pas pour l'etat fusionne. Rebase (git pull --rebase origin ${{ github.base_ref }}) puis repousse."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio pytest-cov anyio httpx

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Typecheck and build here rather than discovering a TypeScript
      # regression during the production image build.
      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run tests
        # --cov ajoute le 2026-09-06 : pytest-cov etait installe mais jamais
        # utilise, donc la couverture n'existait pas. Sans `-x`, pour que
        # Codecov recoive un rapport complet plutot que celui des tests joues
        # avant le premier echec.
        run: uv run pytest -q -m "not integration" --ignore=tests/test_integration.py --cov=src --cov-report=xml

      # Codecov, aligne sur triton. Le jeton vient de 1Password et non d'un
      # secret GitHub, pour qu'il n'en reste qu'un seul dans l'interface.
      - name: Install 1Password CLI
        if: ${{ !cancelled() }}
        uses: 1password/install-cli-action@v1

      - name: Load Codecov token from 1Password
        if: ${{ !cancelled() }}
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://Dev/Env/CODECOV_TOKEN

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          # Un envoi Codecov en echec ne doit pas faire echouer la CI : c'est de
          # l'information sur les tests, pas un test.
          fail_ci_if_error: false

  release-please:
    name: "\U0001F4E6 Release Please"
    # Le job de tests a QUITTE ce `needs` : il ne tourne plus que sur une PR, donc
    # il est SAUTE sur la branche par defaut. Le garder dependrait d'un
    # comportement subtil — un `needs` saute ne fait pas sauter le dependant
    # seulement si la condition contient une fonction de statut. On retire la
    # dependance plutot que de s'appuyer la-dessus : la garantie vient de la PR.
    runs-on: ubuntu-latest
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'chore(main): release')

    steps:
      - uses: actions/checkout@v4

      # Le PAT, charge depuis 1Password plutot que pose en secret GitHub.
      #
      # GITHUB_TOKEN ne peut pas faire ce travail, et ce n'est pas un defaut de
      # configuration : GitHub refuse deliberement que les evenements produits
      # par ce jeton en declenchent d'autres, pour empecher les boucles
      # infinies. Deux consequences, mesurees sur ce depot :
      #
      #   - la PR de release ouverte par le bot voit son run refuse au demarrage
      #     (0 job, conclusion `failure`) — cosmetique mais rouge
      #   - la fusion faite par le bot ne declenche AUCUN workflow, donc rien ne
      #     publie la release, qui attend le prochain push humain
      #
      # Le second n'est pas cosmetique : le 2026-09-09 la PR 1.27.8 etait
      # fusionnee alors que la derniere release publiee restait v1.27.7. Un
      # decalage permanent d'une version, sur les quatre depots.
      #
      # Aucun secret GitHub supplementaire : l'entree existe deja dans le coffre
      # et ce workflow sait deja y lire (cf. CODECOV_TOKEN plus haut).
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load release token from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GHP_TOKEN: op://Dev/GHP_TOKEN/identifiant

      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          # No `release-type` here, deliberately. Passing it puts the action in
          # manifest-less mode, where `release-please-config.json` is read by
          # nothing — which is why the config added to group the changelog had
          # no effect on 1.26.0, and why the other repository's changelog is
          # also still on the default sections despite carrying the same file.
          #
          # Without it the action reads the config and the manifest, both of
          # which are committed here, and the release type comes from the
          # config's `packages` entry.
          token: ${{ env.GHP_TOKEN }}
          target-branch: main

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create release archive
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
          mkdir -p "shazamer-${VERSION}"
          cp -r src web/src web/package.json web/index.html web/vite.config.ts \
                web/tsconfig.json requirements.txt README.md LICENSE Makefile \
                Dockerfile "shazamer-${VERSION}/"
          tar -czf "shazamer-${VERSION}.tar.gz" "shazamer-${VERSION}"
          zip -r "shazamer-${VERSION}.zip" "shazamer-${VERSION}"

      - name: Upload Release Artifacts
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ env.GHP_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
          gh release upload ${{ steps.release.outputs.tag_name }} \
            "shazamer-${VERSION}.tar.gz" \
            "shazamer-${VERSION}.zip"

  auto-merge:
    name: "\U0001F500 Auto Merge Release"
    # Le job de tests a QUITTE ce `needs` : il ne tourne plus que sur une PR, donc
    # il est SAUTE sur la branche par defaut. Le garder dependrait d'un
    # comportement subtil — un `needs` saute ne fait pas sauter le dependant
    # seulement si la condition contient une fonction de statut. On retire la
    # dependance plutot que de s'appuyer la-dessus : la garantie vient de la PR.
    needs: [release-please]
    runs-on: ubuntu-latest
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'

    concurrency:
      group: auto-merge-release-please
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # Job distinct, donc chargement distinct : `export-env` n'expose la
      # variable qu'aux etapes du job ou l'action s'execute, jamais aux autres.
      #
      # Et c'est ICI que le PAT compte le plus. GITHUB_TOKEN sait fusionner une
      # PR — ce n'est pas ce qui manquait — mais la fusion qu'il produit ne
      # declenche aucun workflow, donc rien ne publie la release qui vient
      # d'etre fusionnee. Avec le PAT, la fusion est un evenement ordinaire et
      # la chaine se poursuit.
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load merge token from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GHP_TOKEN: op://Dev/GHP_TOKEN/identifiant

      - name: Find and merge release-please PR
        env:
          GH_TOKEN: ${{ env.GHP_TOKEN }}
        run: |
          sleep 10
          PR_NUMBER=$(gh pr list --head "release-please--branches--main" --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "Found release-please PR #$PR_NUMBER"
            gh pr merge "$PR_NUMBER" --squash
            echo "Successfully merged release-please PR #$PR_NUMBER"
          else
            echo "No open release-please PR found, skipping"
          fi

  deploy:
    name: "\U0001F680 Deploy"
    # Le job de tests a QUITTE ce `needs` : il ne tourne plus que sur une PR, donc
    # il est SAUTE sur la branche par defaut. Le garder dependrait d'un
    # comportement subtil — un `needs` saute ne fait pas sauter le dependant
    # seulement si la condition contient une fonction de statut. On retire la
    # dependance plutot que de s'appuyer la-dessus : la garantie vient de la PR.
    needs: [auto-merge]
    runs-on: ubuntu-latest
    if: >-
      !failure() && !cancelled()
      && github.event_name != 'pull_request'
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
    # Le job ne fait plus qu'une chose : resoudre le .env et LANCER le
    # deploiement. La construction de l'image et la mise a jour tournante se
    # poursuivent sur le serveur apres la fin du job, donc la borne n'a plus a
    # les couvrir. Si ces dix minutes ne suffisent pas, c'est que le serveur est
    # injoignable — et c'est bien un echec.
    timeout-minutes: 10

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Un seul secret GitHub au lieu de douze.
      #
      # Les valeurs vivent dans 1Password et le depot n'en porte que des
      # REFERENCES (.env, entierement commite). On sort ainsi du regime ou la
      # meme valeur existait a trois endroits — .env local, secrets GitHub,
      # .env serveur — sans que rien ne garantisse qu'ils concordent.
      #
      # Le jeton donne acces au coffre `Dev` en lecture. Le perimetre du coffre
      # EST le perimetre de la fuite si ce jeton s'echappe : n'y mettre que ce
      # que le deploiement doit lire.
      # Un seul secret GitHub au lieu de douze. Ici, UNIQUEMENT ce dont le
      # DEPLOIEMENT a besoin pour joindre le serveur — rien de ce que
      # l'application lit a l'execution.
      #
      # Cette separation est ce qui supprime la duplication. Les variables
      # runtime vivent dans .env, resolues plus bas par `op inject` ; celles-ci
      # ne servent qu'ici et ne figurent nulle part ailleurs. Une place par
      # usage, plutot qu'un fichier unique obligeant a declarer chaque variable
      # deux fois.
      #
      # Verifie le 2026-09-04 : aucun code sous src/ ne lit SSH_* ni TS_*.
      # load-secrets-action embarque le CLI mais ne le publie pas sur le PATH ;
      # `op inject` plus bas en a besoin explicitement.
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load deploy credentials from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_HOST: op://Dev/Serveur/hostname
          SSH_PORT: op://Dev/Serveur/port
          SSH_USER: op://Dev/Serveur/username
          SSH_PRIVATE_KEY: op://Dev/SSHgithub/private_key
          TS_OAUTH_CLIENT_ID: op://Dev/Tailscale/username
          TS_OAUTH_SECRET: op://Dev/Tailscale/identifiant

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          # $TS_* et non secrets.* : l'etape 1Password ci-dessus les a exportes
          # dans l'environnement du job (export-env: true).
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:github-action

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        # SSH_HOST vient de l'etape 1Password, deja dans l'environnement.
        run: |
          HOST=$(echo "$SSH_HOST" | cut -d':' -f1)
          # `${SSH_HOST##*:}` ne rend le port que s'il y en a un ; sinon il rend
          # l'hote entier, d'ou le test numerique. L'ancienne forme
          # `grep -o ':[0-9]*' | cut -f2 || echo 22` ne pouvait PAS retomber sur
          # le defaut : cut reussit meme sur une entree vide, donc le `||`
          # n'etait jamais atteint et PORT restait VIDE — `Bad port ''`.
          PORT="${SSH_HOST##*:}"
          case "$PORT" in
            ''|*[!0-9]*) PORT="${SSH_PORT:-22}" ;;
          esac
          ssh-keyscan -H -p $PORT $HOST >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          # SSH_* viennent de l'etape 1Password ci-dessus. Les variables que
          # l'APPLICATION lit ne passent plus par ici : elles sont dans .env et
          # `op inject` les resout plus bas.
          #
          # DEPLOY_PATH n'est PAS un secret et n'a jamais eu a en etre un : un
          # chemin ne donne aucun acces, et le serveur refuse l'authentification
          # par mot de passe (verifie le 2026-09-04).
          DEPLOY_PATH: /home/sharon/shazamer
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          HOST=$(echo $SSH_HOST | cut -d':' -f1)
          # `${SSH_HOST##*:}` ne rend le port que s'il y en a un ; sinon il rend
          # l'hote entier, d'ou le test numerique. L'ancienne forme
          # `grep -o ':[0-9]*' | cut -f2 || echo 22` ne pouvait PAS retomber sur
          # le defaut : cut reussit meme sur une entree vide, donc le `||`
          # n'etait jamais atteint et PORT restait VIDE — `Bad port ''`.
          PORT="${SSH_HOST##*:}"
          case "$PORT" in
            ''|*[!0-9]*) PORT="${SSH_PORT:-22}" ;;
          esac

          # 1. Update code
          # Le `git fetch`/`reset --hard` ne se fait PLUS ici. Il etait dans son propre
          # appel ssh, donc hors du verrou — et meme hors de la session qui deploie. Les
          # deploiements partagent un seul repertoire de travail sur le serveur : le
          # 01/10, une image a ete construite depuis un contexte qui n'etait plus celui
          # de l'arbre. Il est desormais dans le bloc detache, sous verrou.

          # 2. Resolve .env with 1Password and ship it.
          #
          # `op inject` lit le .env DU DEPOT et substitue chaque reference
          # `op://` par sa valeur. Le depot est donc l'unique endroit ou une
          # variable runtime est declaree : en ajouter une la suffit, il n'y a
          # pas de seconde liste a tenir a jour ici.
          #
          # C'est ce qui remplace l'ancien bloc de `printf` par variable, et le
          # bug qu'il portait : les cinq variables SMTP n'y figuraient pas, donc
          # depuis que le .env du depot arrive sur le serveur ce sont les
          # references `op://` BRUTES qui y atterrissaient. Une valeur qui
          # ressemble a une URL sans en etre une — l'envoi d'e-mails aurait
          # echoue loin d'ici, sur un message n'expliquant rien.
          #
          # PYTHON_ENV est force a Production apres l'injection : le fichier
          # commite porte Development, et c'est le bon defaut (un oubli donne du
          # dev, jamais une prod tournant en mode dev).
          op inject -i .env -o /tmp/env.resolved
          sed -i 's/^PYTHON_ENV=.*/PYTHON_ENV=Production/' /tmp/env.resolved

          # Transfere puis efface. `install -m 600` pose les droits AVANT
          # d'ecrire le contenu, contrairement a un `cat >` suivi d'un chmod qui
          # laisse une fenetre ou le fichier est lisible par tous.
          scp -P $PORT /tmp/env.resolved $SSH_USER@$HOST:/tmp/env.shazamer
          rm -f /tmp/env.resolved
          ssh -p $PORT $SSH_USER@$HOST "
            set -e
            install -m 600 /tmp/env.shazamer $DEPLOY_PATH/.env
            rm -f /tmp/env.shazamer
            echo \"env: \$(grep -c '^[A-Z_]*=' $DEPLOY_PATH/.env) variable(s)\"
          "

          # DEPLOIEMENT DETACHE — le runner ne l'attend plus.
          #
          # Il l'attendait, et l'attente se comptait en quart d'heure : la
          # construction de l'image se fait sur le SERVEUR, et le runner ne
          # faisait que tenir une session SSH ouverte pendant ce temps. Ces
          # minutes etaient facturees a chaque poussee pour ne rien calculer.
          #
          # Le verdict n'est pas perdu, il change de lecteur. Il est cote
          # serveur, dans scripts/deploy.sh, qui attend la convergence et sort
          # en erreur si la nouvelle tache ne devient pas saine. Le script
          # publie son heure de debut, son heure de fin et son code de sortie ;
          # deux alertes Grafana les lisent — « Deploy started but never
          # finished » (45 min) et « Last deploy failed ».
          #
          # `setsid` detache le processus de la session SSH, sans quoi il
          # recevrait SIGHUP a la fermeture du canal.
          #
          # Les accolades ne sont pas decoratives. `A && B > f &` met toute la
          # liste en fond mais n'applique la redirection qu'a `B` : le sous-shell
          # garde la sortie de `ssh` ouverte tant qu'il vit, et `ssh` ne rend la
          # main que quand le canal se ferme — donc au bout du deploiement
          # entier. Le detachement etait annule SANS AUCUN MESSAGE. Mesure sur
          # le serveur : 15 s sans les accolades contre 1 s avec, pour un
          # `sleep 15`. Les trois descripteurs sont rediriges pour la meme
          # raison — un seul encore ouvert suffit a tenir le canal.
          LOG="deploy-logs/shazamer-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:7}.log"
          ssh -n -p $PORT $SSH_USER@$HOST "{ mkdir -p ~/deploy-logs \
            && DEPLOY_PATH='$DEPLOY_PATH' setsid nohup bash -c '
                 set -e
                                  # ON DEPLOIE LA TETE DE BRANCHE, relue SOUS VERROU — pas un SHA fige.
                 exec 9>"/tmp/deploy-$SVC.lock"
                 if ! flock -n 9; then
                   echo ">> Un autre deploiement de $SVC est en cours — on attend son tour."
                   flock -w 2700 9 || { echo ">> ECHEC : verrou non libere en 2700 s." >&2; exit 75; }
                 fi
                 cd "$DEPLOY_PATH"
                 git fetch origin
                 git reset --hard origin/main
                 install -m 600 /tmp/env.shazamer .env 2>/dev/null || true
                 rm -f /tmp/env.shazamer
                 chmod +x scripts/deploy.sh
                 DEPLOY_LOCK_HELD=1 bash scripts/deploy.sh' ; \
            } > ~/$LOG 2>&1 < /dev/null & \
            echo 'deploiement lance en tache de fond'"
          echo "::notice::Deploiement lance sur le serveur, sans attente du runner. Journal : ~/$LOG. Une panne remonte par les alertes Grafana deploy-stuck / deploy-failed."

      # Il y avait ici une etape de verification post-deploiement, cote runner.
      # Elle est retiree, et rien n'est perdu.
      #
      # Ce qu'elle faisait est DEJA fait par scripts/deploy.sh, sur le serveur,
      # au moment ou le deploiement se termine vraiment — meme sondage, meme
      # sortie en erreur. Elle le refaisait a distance, une seconde fois.
      #
      # Et depuis que le deploiement est detache, elle ne pourrait plus rien
      # affirmer : elle sonderait pendant la construction, donc l'ANCIENNE
      # version, encore en place et parfaitement saine. Elle aurait declare un
      # succes a chaque fois, y compris pour un deploiement rate. Une
      # verification qui passe toujours vaut moins que pas de verification.
      #
      # Le verdict du serveur remonte par les alertes Grafana deploy-stuck et
      # deploy-failed.

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment to shazamer.pierregallet.com completed successfully!"
          else
            echo "Deployment failed! Check the logs for more information."
          fi
